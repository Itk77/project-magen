[project]
name = "magen"
version = "0.1.0"
description = "project magen"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = []

[dependency-groups]
shared = [
    "numpy>=1.24,<3",
]
visual-processing = [
    "opencv-python>=4.8,<5",
    "ultralytics>=8.2,<9",
    "torch==2.9,<2.10",
    "torchvision==0.24.0,<0.25.0",
    "openvino<=2025.4.1",
]
audio-io = [
    "RPi.GPIO>=0.7,<1",
    "sounddevice>=0.4.6,<1",
    "websockets>=12,<15",
]
tts-edge = [
    "edge-tts>=6.1,<8",
]
llm-gemini = [
    "google-genai>=0.8,<1",
]
main-server = [
    "aiohttp>=3.10,<4",
    "paho-mqtt>=1.6.1,<3",
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "ultralytics>=8.2,<9",
    "RPi.GPIO>=0.7,<1",
    "sounddevice>=0.4.6,<1",
    "websockets>=12,<15",
    "edge-tts>=6.1,<8",
    "google-genai>=0.8,<1",
]

[tool.uv]
default-groups = "all"
